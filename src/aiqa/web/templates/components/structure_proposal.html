<section id="structure-proposals" data-project="{{ project_id }}" data-case="{{ case_id }}" data-head="{{ head }}">
  <p>구조화 제안은 차이를 확인한 뒤에만 수락합니다.</p>
  <div id="structure-proposal-list">
  {% for proposal in proposals if proposal.kind == 'structure' %}
    <article data-proposal="{{ proposal.proposal_id }}">
      <p>기준 버전 {{ proposal.base_version_id }} / 현재 초안 {{ head }}</p>
      <p>변경 필드 {{ proposal.changed_fields|join(', ') }}</p>
      <pre>{{ proposal.body | tojson(indent=2) }}</pre>
      <button type="button" data-decision="reject">구조화 거부</button>
      <button type="button" data-decision="accept"{% if proposal.base_version_id != head %} disabled title="기준 버전이 오래되었습니다. 최신 초안에서 새 제안을 만드세요."{% endif %}>구조화 수락</button>
    </article>
  {% else %}
    <p>검토할 구조화 제안이 없습니다.</p>
  {% endfor %}
  </div>
  <p id="structure-proposal-status" role="status"></p>
</section>
<script src="/static/proposals.js?v={{ ui_asset_version }}"></script>
