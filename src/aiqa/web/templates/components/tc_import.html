<section id="tc-import" data-project="{{ project_id }}" data-case="{{ case_id }}" data-head="{{ head }}">
  <p>가져오기는 차이를 확인한 뒤에만 수락합니다.</p>
  <p>참조 연결과 내용 가져오기는 서로 다른 동작입니다.</p>
  <div id="proposal-list">
  {% for proposal in proposals %}
    <article data-proposal="{{ proposal.proposal_id }}">
      <p>기준 버전 {{ proposal.base_version_id }} / 현재 초안 {{ head }}</p>
      <pre>{{ proposal.body | tojson(indent=2) }}</pre>
      <button type="button" data-decision="reject">가져오기 거부</button>
      <button type="button" data-decision="accept"{% if proposal.base_version_id != head %} disabled title="기준 버전이 오래되었습니다. 최신 초안에서 새 제안을 만드세요."{% endif %}>가져오기 수락</button>
    </article>
  {% else %}<p>검토할 제안이 없습니다.</p>{% endfor %}
  </div>
  <p id="proposal-status" role="status"></p>
</section>
<script src="/static/proposals.js"></script>
