<form id="revoke-confirm" data-fallback="false" data-queued="{{ revoke.queued }}" data-running="{{ revoke.running }}" data-suites="{{ revoke.suites }}" data-approval="{{ revoke.approval_id }}">
<h2>승인 철회</h2><p>대기 {{ revoke.queued }}건은 접수되지 않습니다.</p><p>진행 {{ revoke.running }}건은 취소 기록으로 남습니다.</p><p>묶음 참조 {{ revoke.suites }}건이 이 승인에 연결되어 있습니다.</p><p>철회하면 기본본은 비워지고 이전 승인으로 되돌리지 않습니다.</p><label>철회 사유 <textarea id="revoke-reason" name="reason" rows="3"></textarea></label><input type="submit" id="revoke-approval" data-save-button data-approval="{{ revoke.approval_id }}" value="이 승인을 철회"><p id="revoke-result" role="status"></p>{% include 'components/form_feedback.html' %}
</form><script src="/static/revoke_editor.js?v={{ ui_asset_version }}"></script>
