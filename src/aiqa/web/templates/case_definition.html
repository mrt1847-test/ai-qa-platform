<form id="definition-form" method="post" action="/ui/projects/{{ project_id }}/cases/{{ case_id }}/definition">
  <input id="expected-head" type="hidden" value="{{ draft.version_id or '' }}">
  <section class="panel"><h2>테스트 내용</h2><label>자연어 <textarea name="raw_text" rows="4" placeholder="G마켓에서 ‘노트북’을 검색해 줘.">{{ snapshot.definition.raw_text or snapshot.definition.objective }}</textarea></label><label>사전조건 (선택) <textarea name="preconditions" rows="2">{{ snapshot.definition.preconditions|join('\n') }}</textarea></label></section>
  <section class="panel"><div class="section-heading"><h2>Assertion</h2><input type="button" class="secondary" id="add-final-check" value="Assertion 추가"></div><div id="definition-final-checks"></div></section>
  <details class="panel"><summary>세부 설정</summary>
  <section><div class="section-heading"><h2>입력 변수</h2><input type="button" class="secondary" id="add-variable" value="변수 추가"></div><div class="table-scroll"><table><caption class="sr-only">검증에 사용할 변수</caption><thead><tr><th scope="col">이름</th><th scope="col">값 종류</th><th scope="col">값</th><th scope="col">동작</th></tr></thead><tbody id="definition-variables"></tbody></table></div></section>
  <section><div class="section-heading"><h2>계정 참조</h2><input type="button" class="secondary" id="add-secret-reference" value="참조 추가"></div><div id="definition-secret-refs"></div></section>
  <section class="panel"><div class="section-heading"><h2>수행 의도와 단계별 검증</h2><input type="button" class="secondary" id="add-definition-step" value="단계 추가"></div><p class="hint" id="recorded-step-hint" hidden>녹화된 절차의 수정·재배치는 단계 탭에서 새 버전으로 진행합니다. 여기서는 기존 연결을 유지합니다.</p><div id="definition-steps"></div></section>
  <section class="panel"><h2>필수·금지 경로</h2><div class="form-grid"><label>필수 경로 <textarea name="must_use" rows="3">{{ snapshot.definition.path_policy.must_use|join('\n') }}</textarea></label><label>금지 경로 <textarea name="forbidden" rows="3">{{ snapshot.definition.path_policy.forbidden|join('\n') }}</textarea></label></div></section>
  </details>
  {% include "components/form_feedback.html" %}
  <div class="action-bar"><input type="submit" data-save-button value="초안 저장"></div>
  <details><summary>고급 · 검증 정의 원본 보기</summary><pre id="definition-preview" aria-label="검증 정의 원본"></pre></details>
</form>
<script id="definition-snapshot" type="application/json">{{ snapshot | tojson }}</script>
<script src="/static/definition_model.js?v={{ ui_asset_version }}"></script>
<script src="/static/definition_editor.js?v={{ ui_asset_version }}"></script>
