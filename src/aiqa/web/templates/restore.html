<body>
  <h1>복원 검사</h1>
  <p>복원 검사는 실행 중인 저장소와 다른 경로에서 합니다.</p>
  <p>검사는 schema, 외래 키, integrity, manifest, hash, 누락된 사실을 보여 줍니다.</p>
  <p>이 PC 전체 저장소에 영향을 줍니다. 프로젝트 권한만으로는 활성화할 수 없습니다.</p>
  <p>활성화는 이 컴퓨터의 소유자가 명시적으로 확인합니다.</p>
  <p>키는 다시 설정해야 합니다.</p>
  <p>과거 대기 작업과 실행 작업은 다시 시작하지 않습니다.</p>
  <p>worker 세션은 폐기하고 자원은 격리한 뒤 진단합니다.</p>
</body>
</html>
