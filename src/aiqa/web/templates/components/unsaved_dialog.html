<dialog id="unsaved-dialog" aria-labelledby="unsaved-title">
  <h2 id="unsaved-title">저장하지 않은 변경이 있습니다</h2>
  <p data-leave-note>입력한 내용을 저장한 뒤 이동할 수 있습니다.</p>
  <div class="dialog-actions">
    <input type="button" data-leave-choice="save" value="저장 후 이동">
    <input type="button" class="secondary" data-leave-choice="discard" value="버리고 이동">
    <input type="button" class="quiet" data-leave-choice="cancel" value="계속 편집">
  </div>
</dialog>
